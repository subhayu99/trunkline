<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="trunkline">
  <!-- rounded-square plate -->
  <rect x="14" y="14" width="228" height="228" rx="44" fill="#0e1219"/>
  <rect x="20" y="20" width="216" height="216" rx="38" fill="none" stroke="#e6ebf2" stroke-width="5"/>

  <!-- vertical trunk -->
  <path d="M88 50
           Q88 70 96 78
           Q88 86 88 96
           Q88 104 96 110
           Q88 116 88 128
           Q88 138 96 144
           Q88 150 88 162
           Q88 178 96 186
           Q88 196 88 206"
        fill="none" stroke="#e6ebf2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- branch 1 (top) -->
  <path d="M96 78 Q140 78 168 78"
        fill="none" stroke="#e6ebf2" stroke-width="7.5" stroke-linecap="round"/>
  <circle cx="184" cy="78" r="12" fill="#0e1219" stroke="#e6ebf2" stroke-width="5"/>

  <!-- branch 2 -->
  <path d="M96 110 Q132 110 160 110"
        fill="none" stroke="#e6ebf2" stroke-width="7.5" stroke-linecap="round"/>
  <circle cx="176" cy="110" r="13" fill="#0e1219" stroke="#e6ebf2" stroke-width="5"/>

  <!-- branch 3 — accent (orange) -->
  <path d="M96 144 Q140 144 168 144"
        fill="none" stroke="#e88a5a" stroke-width="9" stroke-linecap="round"/>
  <circle cx="186" cy="144" r="14" fill="#e88a5a" stroke="#e88a5a" stroke-width="2"/>

  <!-- branch 4 -->
  <path d="M96 186 Q132 186 162 186"
        fill="none" stroke="#e6ebf2" stroke-width="7.5" stroke-linecap="round"/>
  <circle cx="178" cy="186" r="13" fill="#0e1219" stroke="#e6ebf2" stroke-width="5"/>
</svg>
