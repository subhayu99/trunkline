<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-label="trunkline">
  <style><![CDATA[
    .wm { font: 700 86px "JetBrains Mono", "Berkeley Mono", "Fira Mono", "Söhne Mono", "SF Mono", "Menlo", monospace; letter-spacing: -0.01em; }
  ]]></style>

  <!-- mark plate -->
  <rect x="14" y="20" width="120" height="120" rx="24" fill="#0e1219"/>
  <rect x="18" y="24" width="112" height="112" rx="21" fill="none" stroke="#e6ebf2" stroke-width="3"/>

  <!-- vertical trunk inside the plate -->
  <path d="M50 38
           Q50 48 54 52
           Q50 56 50 62
           Q50 68 54 71
           Q50 74 50 82
           Q50 90 54 94
           Q50 98 50 104
           Q50 116 54 120
           Q50 124 50 130"
        fill="none" stroke="#e6ebf2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- branches with terminal nodes -->
  <path d="M54 52 L92 52" fill="none" stroke="#e6ebf2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="52" r="6" fill="#0e1219" stroke="#e6ebf2" stroke-width="2.6"/>

  <path d="M54 71 L86 71" fill="none" stroke="#e6ebf2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="94" cy="71" r="7" fill="#0e1219" stroke="#e6ebf2" stroke-width="2.6"/>

  <!-- accent branch -->
  <path d="M54 94 L93 94" fill="none" stroke="#e88a5a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="103" cy="94" r="7.5" fill="#e88a5a"/>

  <path d="M54 120 L88 120" fill="none" stroke="#e6ebf2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="96" cy="120" r="7" fill="#0e1219" stroke="#e6ebf2" stroke-width="2.6"/>

  <!-- wordmark -->
  <text x="170" y="108" class="wm" fill="#e6ebf2">trunkline</text>
</svg>
